name: Evidence rollout audit

on:
  schedule:
    # The ordinary receipt path is checked daily; direct execution remains the
    # independently measured oracle rather than disappearing after rollout.
    - cron: "53 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  # Single rollback switch: change `receipt` to `direct`. Production and
  # consumption remain separate commands, so either route is independently
  # runnable while the producer still records the same direct oracle.
  APLAN_EVIDENCE_ROUTE: receipt

permissions:
  contents: read

jobs:
  produce:
    name: direct oracle and receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: prepare a GitHub-hosted runner
        run: ci/scripts/prepare-hosted.sh base
      - name: build the audited binary
        run: cargo build --release --locked -p aplan
      - name: record direct oracle and receipt artifact
        run: >-
          python3 ci/scripts/evidence-gate-rollout.py produce
          --binary "${CARGO_TARGET_DIR:-target}/release/aplan"
          --output evidence-rollout
          --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW"
          --run-id "$GITHUB_RUN_ID"
          --event "$GITHUB_EVENT_NAME"
          --privilege trusted
      - name: upload the bounded rollout artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-rollout-${{ github.run_id }}
          path: evidence-rollout
          if-no-files-found: error
          retention-days: 7

  consume:
    name: artifact-backed parity and latency
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: start the post-setup evidence gate clock
        run: echo "APLAN_GATE_START_EPOCH_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: download the producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-rollout-${{ github.run_id }}
          path: ${{ runner.temp }}/aplan-evidence-rollout-${{ github.run_id }}
      - name: consume authenticated observations and compare the oracle
        run: >-
          python3 ci/scripts/evidence-gate-rollout.py consume
          --bundle "$RUNNER_TEMP/aplan-evidence-rollout-$GITHUB_RUN_ID"
          --route "$APLAN_EVIDENCE_ROUTE"
          --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW"
          --run-id "$GITHUB_RUN_ID"
          --event "$GITHUB_EVENT_NAME"
          --privilege trusted
          --gate-start-epoch-ms "$APLAN_GATE_START_EPOCH_MS"
          --output evidence-rollout-result.json
      - name: publish the measured result
        run: |
          cat evidence-rollout-result.json
          cat evidence-rollout-result.json >> "$GITHUB_STEP_SUMMARY"
