name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Releases use a pinned GA GitHub-hosted Linux image. This still publishes one
# portable Linux x86_64 binary; multi-platform packaging remains a distribution decision,
# not a side effect of changing CI placement (HLD Section 17).
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  # Both validation and artifact construction refuse unless this exact full
  # commit is still checked out. A ref name or another workflow's result cannot
  # authorize publication.
  APLAN_RELEASE_SHA: ${{ github.sha }}

permissions:
  contents: write # create the release and upload its asset
  id-token: write # exchange this job's identity for Sigstore and crates.io credentials
  attestations: write # persist the archive's signed build-provenance statement

jobs:
  release:
    name: build + publish
    # A pull request never publishes.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # crates.io binds its trusted publisher to this environment as well as this
    # repository and workflow. GitHub separately requires an independent
    # approval before the job can enter it.
    environment: release
    # Full validation and artifact construction run cold. Leave a bounded
    # margin without returning to an unbounded publishing job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # `aplan version` derives the required release from the last reachable
        # tag and the tasks closed since it. Checkout's one-commit default has
        # neither, so the release gate would correctly refuse the shallow tree
        # after spending the time to build it (`A1-402`).
        with:
          fetch-depth: 0

      - name: prepare a GitHub-hosted runner
        run: ci/scripts/prepare-hosted.sh release

      # The full profile includes the shared test gate. Verify or install its
      # exact runner; an image preload is a speed optimization rather than
      # permission to run an unpinned binary.
      - name: install the pinned test runner
        run: ci/scripts/install-nextest.sh install
      - name: install the pinned supply-chain auditor
        run: ci/scripts/install-cargo-deny.sh install

      # This is the publication dependency: the same job, checkout and exact
      # github.sha proceed from all eleven full gates to artifact construction.
      # A failed, skipped, cancelled or stale validation cannot reach publish.
      - name: full validation on the exact release source
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ci/scripts/validate.sh --profile release

      # Artifact compilation runs in the digest-pinned builder declared by
      # ci/release.Containerfile, so native C and archive tools cannot drift with
      # the hosted image. The script first proves that --no-default-features
      # omits the terminal stack, then explicitly enables `tui`. The resulting
      # musl binary is static, and tag, version, source and plan arithmetic are
      # checked before anything can be published.
      - name: build the release artifact
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ci/scripts/release.sh

      # Bind the archive digest to this repository, workflow and exact source
      # with a short-lived Sigstore certificate. Manual staging exercises the
      # same path without publishing, so the first tag is not its first test.
      - name: attest the release archive
        id: release_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # Verify the bundle just created, not any older attestation for matching
      # bytes. Repository, workflow, ref, source, signer revision and hosted
      # runner are all part of the policy and publication cannot bypass it.
      - name: verify the release provenance
        env:
          APLAN_ATTESTATION_BUNDLE: ${{ steps.release_attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: ci/scripts/verify-release-provenance.sh

      # The first public release bootstraps each new crate with a maintainer
      # token. Every later tag exchanges this exact job identity for one
      # short-lived token scoped by crates.io to the ten configured packages.
      - name: authenticate with crates.io
        id: crates_io_auth
        if: github.ref_type == 'tag'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: publish the crates.io packages
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: ci/scripts/publish-crates.sh

      # The crates.io transaction includes another pinned action and script.
      # Reverify afterward so the bytes uploaded to GitHub are still the bytes
      # named by this run's attestation.
      - name: reverify provenance before asset publication
        if: github.ref_type == 'tag'
        env:
          APLAN_ATTESTATION_BUNDLE: ${{ steps.release_attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: ci/scripts/verify-release-provenance.sh

      # A release is a claim about a commit, so publish the checksum beside the
      # archive: it is what lets the GitHub Action (A1-003) pin an exact artifact
      # rather than trusting whatever the URL serves.
      - name: publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: ci/scripts/publish-github-release.sh
