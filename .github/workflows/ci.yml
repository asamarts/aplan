name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Away from the top of the hour, where GitHub documents higher schedule load.
    - cron: "37 7 * * *"
  workflow_dispatch:

# A newer ordinary run supersedes an older verdict for the same branch or pull
# request. Full runs use their unique run id instead: neither a development run
# nor another manual/nightly oracle can cancel or replace one.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' && format('{0}-development-pr-{1}', github.workflow, github.event.pull_request.number)) || (github.event_name == 'push' && format('{0}-development-ref-{1}', github.workflow, github.ref)) || format('{0}-full-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# Every job uses a fresh GitHub-hosted VM. Required checks pin GA images so an
# image migration cannot change the merge contract without a reviewed edit.
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

# Least privilege: the jobs only read the repo and post annotations via workflow
# commands, so the token needs nothing beyond contents: read.
permissions:
  contents: read

jobs:
  development:
    name: Linux development validation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # This is the rollback switch. Changing this one value to `full` makes the
    # ordinary job prepare and execute the complete profile without editing its
    # steps or reconstructing any gate.
    env:
      APLAN_ORDINARY_PROFILE: development
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The classifier computes a merge base and validates the checked-out
        # source identity. A shallow checkout would force safe full widening.
        with:
          fetch-depth: 0
      - name: prepare a GitHub-hosted runner
        run: ci/scripts/prepare-hosted.sh "$APLAN_ORDINARY_PROFILE"
      - name: install the pinned test runner
        run: ci/scripts/install-nextest.sh install
      - name: install the pinned supply-chain auditor
        run: ci/scripts/install-cargo-deny.sh install
      - name: change-aware development validation
        env:
          APLAN_VALIDATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          APLAN_VALIDATION_HEAD: ${{ github.sha }}
        run: ci/scripts/preflight.sh --profile "$APLAN_ORDINARY_PROFILE" --base "$APLAN_VALIDATION_BASE" --head "$APLAN_VALIDATION_HEAD"

  platform:
    name: ${{ matrix.name }} portability
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prepare a GitHub-hosted runner
        shell: bash
        run: ci/scripts/prepare-hosted.sh platform
      - name: compile, lint, and test the portable contract
        shell: bash
        run: ci/scripts/platform.sh

  full:
    name: full validation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: prepare a GitHub-hosted runner
        run: ci/scripts/prepare-hosted.sh coverage
      - name: install the pinned test runner
        run: ci/scripts/install-nextest.sh install
      - name: install the pinned supply-chain auditor
        run: ci/scripts/install-cargo-deny.sh install
      - name: complete repository validation
        run: ci/scripts/validate.sh --profile full
