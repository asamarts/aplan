name: Latest stable compatibility

on:
  schedule:
    # Offset from the top of the hour because GitHub warns scheduled runs can
    # be delayed during peak load.
    - cron: "23 5 * * 2"
  workflow_dispatch:

concurrency:
  group: latest-stable-compatibility
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latest-stable:
    name: observational Rust stable compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prepare a GitHub-hosted runner
        run: ci/scripts/prepare-hosted.sh latest-stable
      - name: test the moving stable channel without changing the release compiler
        run: ci/scripts/latest-stable.sh
