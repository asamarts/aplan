name: scale

# Not on push. This generates 24,000 task files and runs the release-profile,
# real-PTY TUI budgets (`A1-229`, `A1-447`), which is not a per-commit cost; the
# per-commit gates are in `ci.yml`.
# Nightly catches a regression within a day, and `workflow_dispatch` is there for
# the change that is *expected* to move the number.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

permissions:
  contents: read

jobs:
  scale:
    name: scale and TUI performance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prepare a GitHub-hosted runner
        run: ci/scripts/prepare-hosted.sh base
      - name: scale and TUI performance
        run: ci/scripts/scale.sh
