version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
