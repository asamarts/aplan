name: aplan - evidence-gated plan check
description: Validate an in-repo plan with aplan, and annotate the pull request where it does not hold up.
author: asamarts
branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: |
      Release to install, as a tag like `v0.4.0`. Leave unset to install the
      release matching the tag the action itself is pinned to, so
      `uses: asamarts/aplan@v0.4.0` installs v0.4.0 and pinning the action pins
      the binary.

      There is deliberately no `latest`: an install that resolves at run time is
      not pinned, and a plan gate that silently changes version between runs is
      the drift this tool exists to reject. Pinning the action to a branch or a
      SHA therefore requires naming a version here explicitly.
    required: false
    default: ""
  command:
    description: |
      Which check to run: `check` (hermetic, the default) or `verify`, which
      resolves evidence against git and needs the full history, so a consumer
      running it must check out with `fetch-depth: 0`.
    required: false
    default: check
  root:
    description: |
      Directory holding the plan's task files. Leave unset to use the `root` key
      in `.aplan.yml`, or aplan's own default (`aplan`), so a repository can
      declare its layout in config rather than repeating it in every workflow.
    required: false
    default: ""
  format:
    description: |
      Output format: `github` (inline annotations, the default), `human`, `json`,
      or `agent`.
    required: false
    default: github
  args:
    description: |
      Extra CLI arguments appended verbatim after the subcommand.

      Worth knowing before this action is the only thing reading the output: a
      warning does not fail it. Both commands exit `0` with warnings outstanding,
      and 27 of aplan's 57 rules are warnings -- including most of what this tool
      says about evidence, such as a task closed over its own unticked criteria
      (`APLAN038`) or, under `command: verify`, a commit citation too broad to
      prove anything (`APLAN024`). Under the default `github` format they still
      annotate the pull request, so they are visible; what they are not is a
      gate, because the check stays green and a green check is what gets merged
      on. `deny_warnings: true` is what makes them block, and it belongs in
      `.aplan.yml` rather than in this input: whether a finding is fatal is the
      plan's policy, not the workflow's.
    required: false
    default: ""
  working-directory:
    description: Directory to run in. Defaults to the runner's workspace.
    required: false
    default: ${{ github.workspace }}
  token:
    description: |
      Token used to download the release asset. The default is the workflow's own
      token, which is enough for a public release; a private repository needs one
      with `contents: read` on the repository that publishes aplan.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The release tag actually installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install aplan
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        # `action_ref` is set for any remote `uses:` and empty for `uses: ./`,
        # which is how this repository's own self-test runs the action.
        ACTION_REF: ${{ github.action_ref }}
        # The repository that publishes the release. `action_repository` is the
        # action's own repo when used remotely; for the local self-test it is
        # empty, and the consumer repo is the publisher.
        SOURCE_REPO: ${{ github.action_repository || github.repository }}
        GH_TOKEN: ${{ inputs.token }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail

        # The published artifact is Linux x86_64 only (one target is what the
        # self-hosted release runner can build). Say so here rather than failing
        # later with a confusing "cannot execute binary file".
        os="$(uname -s)"; arch="$(uname -m)"
        if [[ "$os" != "Linux" || "$arch" != "x86_64" ]]; then
          echo "::error::aplan's action supports Linux x86_64 only; this runner is ${os}/${arch}." >&2
          exit 1
        fi

        # `gh` ships on GitHub-hosted runners but not necessarily on a
        # self-hosted one. Say which tool is missing, rather than letting the
        # download fail with a bare "gh: command not found".
        if ! command -v gh >/dev/null 2>&1; then
          echo "::error::this action needs the GitHub CLI (gh) to download the release asset, and it is not on PATH. It is preinstalled on GitHub-hosted runners; install it on your self-hosted runner." >&2
          exit 1
        fi

        # An explicit version wins. Otherwise take the tag the action is pinned
        # to, and refuse rather than float when that is not a release tag.
        tag="${INPUT_VERSION:-}"
        if [[ -z "$tag" ]]; then
          if [[ "${ACTION_REF:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag="$ACTION_REF"
          else
            echo "::error::No version to install. Pin the action to a release tag (uses: ${SOURCE_REPO}@v0.4.0), or set the 'version' input. This action never resolves 'latest', because an unpinned gate is not a gate." >&2
            exit 1
          fi
        fi
        [[ "$tag" == v* ]] || tag="v${tag}"

        asset="aplan-${tag}-x86_64-unknown-linux-musl.tar.gz"
        dir="${RUNNER_TEMP_DIR:-/tmp}/aplan-${tag}"
        mkdir -p "$dir"

        echo "==> Installing aplan ${tag} from ${SOURCE_REPO}"
        gh release download "$tag" \
          --repo "$SOURCE_REPO" \
          --pattern "$asset" \
          --pattern "${asset}.sha256" \
          --dir "$dir" \
          --clobber

        # Verify what was downloaded against the checksum published beside it.
        # Without this the action trusts whatever the URL served, which is the
        # one thing a gate must not do.
        ( cd "$dir" && sha256sum -c "${asset}.sha256" )

        tar -xzf "${dir}/${asset}" -C "$dir"
        chmod +x "${dir}/aplan"
        echo "$dir" >> "$GITHUB_PATH"
        echo "version=${tag}" >> "$GITHUB_OUTPUT"
        "${dir}/aplan" --version

    - name: Run aplan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        ROOT: ${{ inputs.root }}
        FORMAT: ${{ inputs.format }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        case "$COMMAND" in
          check|verify) ;;
          *) echo "::error::unknown command '${COMMAND}' (expected: check, verify)" >&2; exit 1 ;;
        esac

        # `root` is left off entirely when unset, so `.aplan.yml`'s `root` key (or
        # aplan's default) decides. Passing an empty `--root ""` would override
        # the config with nothing, which is the opposite of what an unset input
        # should mean.
        args=("$COMMAND" --format "$FORMAT")
        [[ -n "$ROOT" ]] && args+=(--root "$ROOT")

        # Split `args` on whitespace, which is what a CLI fragment means, but
        # with globbing off: otherwise `args: --traces-root docs/*` would expand
        # against the runner's filesystem and hand aplan a list of file names
        # instead of the pattern the caller wrote.
        if [[ -n "$EXTRA_ARGS" ]]; then
          set -f
          # shellcheck disable=SC2206  # deliberate word-splitting, globbing disabled.
          extra=($EXTRA_ARGS)
          set +f
          args+=("${extra[@]}")
        fi

        echo "==> aplan ${args[*]}"
        aplan "${args[@]}"
