[package]
name = "aplan-evidence"
description = "The verification ladder: resolve task evidence (commit, file, test) against the git repository."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aplan-core.workspace = true
aplan-config.workspace = true
# For `sanitize`, which this crate does not own: a failed command's output is
# untrusted text, and a second copy of that filter here would be the drift this
# tool exists to report (`A1-365`, the reason `aplan-interop` took the same
# dependency in `A1-189`).
aplan-output.workspace = true
git2 = { version = "0.21", default-features = false }
globset = "0.4"
getrandom.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
