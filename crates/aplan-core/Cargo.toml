[package]
autotests = false
name = "aplan-core"
description = "Core types, loader, and validation engine for aplan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
yaml_compat.workspace = true
# Resolver constraint only; callers use `yaml_compat`, while the dependency
# audit proves that both the wrapper and its engine stay exact.
yaml_engine_pin.workspace = true
schemars.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
globset.workspace = true
ignore.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
