[package]
autotests = false
name = "aplan-interop"
description = "Importers for aplan: read other tools' plans and proposal repositories into tasks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
aplan-config.workspace = true
aplan-core.workspace = true
# For `sanitize`, the one defence a generated document needs and this crate does
# not own: text a plan supplied is untrusted wherever it lands, and a second copy
# of that filter here would be the drift this tool exists to report (`A1-189`).
aplan-output.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
yaml_compat.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
