[package]
name = "aplan-tui-eval"
description = "Opt-in local synthetic actor adapters for aplan TUI evaluation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
aplan-core = { path = "../../crates/aplan-core" }
anyhow = "1"
jsonschema = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_compat = { package = "yaml_serde", version = "=0.10.7" }
sha2 = "0.11"
tempfile = "3"
toml_edit = "0.25"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
