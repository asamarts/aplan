[workspace]
resolver = "3"
members = [
    "crates/aplan-core",
    "crates/aplan-config",
    "crates/aplan-output",
    "crates/aplan-evidence",
    "crates/aplan-interop",
    "crates/aplan",
    "crates/aplan-e2e",
    "xtask",
]
# `cargo run` without -p defaults to the CLI; xtask is explicit-only.
default-members = ["crates/aplan"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/aplan"
authors = ["aplan contributors"]

[workspace.dependencies]
aplan-core = { path = "crates/aplan-core", version = "0.1.0" }
aplan-config = { path = "crates/aplan-config", version = "0.1.0" }
aplan-output = { path = "crates/aplan-output", version = "0.1.0" }
aplan-evidence = { path = "crates/aplan-evidence", version = "0.1.0" }
aplan-interop = { path = "crates/aplan-interop", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1"
jsonschema = { version = "0.47", default-features = false }
clap = { version = "4", features = ["derive", "cargo", "env"] }
ignore = "0.4"
anstream = "1"
anstyle = "1"

tempfile = "3"
trycmd = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
