[workspace]
resolver = "3"
members = [
    "crates/aplan-core",
    "crates/aplan-app",
    "crates/aplan-tui",
    "crates/aplan-config",
    "crates/aplan-output",
    "crates/aplan-evidence",
    "crates/aplan-attest",
    "crates/aplan-interop",
    "crates/aplan-mcp",
    "crates/aplan",
    "crates/aplan-e2e",
    "xtask",
]
# `cargo run` without -p defaults to the CLI; xtask is explicit-only.
default-members = ["crates/aplan"]

[workspace.package]
# `main` deliberately carries a pre-release version: a staged build must never
# report the same string as a published release, or a consumer pinning by
# `--version` pins nothing (`A1-060`). `ci/scripts/release.sh` refuses to tag
# while this is set, so releasing is an explicit bump.
version = "0.5.0-dev"
edition = "2024"
# Raised from 1.85 to match the locked graph, which needed 1.88 through
# `darling 0.23` and had done since before anyone noticed: the declaration was
# a promise a source adopter could not keep, and `cargo xtask msrv` now checks
# it on every run (`A1-327`, pre-public adoption evidence item 15).
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/aplan"
authors = ["aplan contributors"]

[workspace.dependencies]
aplan-core = { path = "crates/aplan-core", version = "0.5.0-dev" }
aplan-app = { path = "crates/aplan-app", version = "0.5.0-dev" }
aplan-tui = { path = "crates/aplan-tui", version = "0.5.0-dev" }
aplan-config = { path = "crates/aplan-config", version = "0.5.0-dev" }
aplan-output = { path = "crates/aplan-output", version = "0.5.0-dev" }
aplan-evidence = { path = "crates/aplan-evidence", version = "0.5.0-dev" }
aplan-attest = { path = "crates/aplan-attest", version = "0.5.0-dev" }
aplan-interop = { path = "crates/aplan-interop", version = "0.5.0-dev" }
aplan-mcp = { path = "crates/aplan-mcp", version = "0.5.0-dev" }
aplan = { path = "crates/aplan", version = "0.5.0-dev" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_compat = { package = "yaml_serde", version = "=0.10.7" }
# `yaml_serde` accepts any compatible 0.3 engine. Keep the translated engine
# exact as well: the compatibility contract and supply-chain review apply to
# both layers, and a lockfile refresh must not widen either one silently.
yaml_engine_pin = { package = "libyaml-rs", version = "=0.3.0" }
schemars = "1"
base64 = "0.23"
jsonschema = { version = "0.58", default-features = false }
clap = { version = "4", features = ["derive", "cargo", "env", "wrap_help"] }

# MCP server (A1-024), on 3.x since `A1-331`. It was held at 2.x because 3.x
# "requires rustc 1.88, and this workspace commits to 1.85" -- and the 2.x it
# stayed on pulled `darling 0.23`, which requires 1.88 anyway, so the constraint
# bought nothing and cost a major version (`A1-327`). Moving cost one signature
# and two constructors: 3.x widened `call_tool`'s reply to an enum. The MSRV is
# unchanged at 1.88 either way, which `cargo xtask msrv` now checks rather than
# anybody asserting it.
rmcp = { version = "3.4.0", features = ["server", "transport-io"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
globset = "0.4"
ignore = "0.4"
# Randomness for `id_strategy: ulid` (`A1-047`) and for the jitter on an id-race
# retry (`A1-230`), and nothing else: a ULID's 80 random bits are the whole
# mechanism, so the alternative was a ULID crate that brings `rand` for the same
# fifteen lines. The jitter wants no more than that either -- unbiased is not a
# property a backoff window needs, and a failed draw falls back to the window.
getrandom = "0.4"
anstream = "1"
anstyle = "1"
unicode-width = "0.2"
unicode-segmentation = "1.13"
terminal_size = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Crossterm's default Unix mio source can consume a simultaneous SIGWINCH
# readiness event before its edge-triggered PTY event, leaving already queued
# input asleep forever. Its use-dev-tty source polls the terminal descriptor
# level-triggered and checks input before resize signals. aplan-tui depends on
# Crossterm directly to unify that feature into Ratatui's backend.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
# Deterministic coordinate kernel behind aplan-app's private terminal-cell
# adapter. Keep renderer, JSON and parallel features out of the product graph.
graphlay = { version = "=0.3.1", default-features = false }
# PTY-backed integration checks only. Default features would add `insta`, but
# aplan keeps its render fixtures as ordinary reviewable text files.
termlens = { version = "0.11.6", default-features = false }
sha2 = "0.11"
blake3 = "1"
signal-hook = "0.3"
shell-words = "1.1"
ctrlc = "3.5"

tempfile = "3"
trycmd = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# New in clippy 1.99. It wants `assert_eq!(x, [] as [T; 0])` wherever a test
# writes `assert!(x.is_empty())`, so that a failure shows the value. The point
# is fair and the suggested form is not: it needs the element type spelled out
# at 62 call sites across 20 files, and reads worse than the predicate it
# replaces. Allowed deliberately rather than silently; whether those assertions
# should say what they saw is a question about diagnostics, not about a lint.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Read commands parse and validate the whole plan in development too. Level 1
# retained debuginfo and incremental compilation while cutting representative
# read CPU time by 4-10x; selective parser/core overrides left unoptimized glue
# dominant and did not deliver an interactive development binary (`A1-588`).
[profile.dev]
opt-level = 1
